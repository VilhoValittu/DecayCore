title: DecayCore
description: "Free FIR room correction and acoustic measurement tool for CamillaDSP, convolution WAV filters, phase-aware correction and temporal decay control."
url: "https://vilhovalittu.github.io"
baseurl: "/DecayCore"
logo: "https://vilhovalittu.github.io/DecayCore/pics/DecayCore_logo_light.png"
repository: VilhoValittu/DecayCore

# GitHub Pages supported theme
theme: minima

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - getting-started.md
  - measurement-workflow.md
  - engineering.md
  - performance/index.md
  - User_Manual.md

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Optional but helpful for SEO
lang: en
timezone: Europe/Helsinki

github:
  repository_url: https://github.com/VilhoValittu/DecayCore

# Prevent unwanted files from being published
exclude:
  - README.md
  - LICENSE
  - .github
  - src
  - dist
  - build
